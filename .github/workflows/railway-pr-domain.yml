name: Railway PR Domain

# Railway does not reliably generate a public domain for PR environments, which
# leaves the preview deployment unreachable until someone clicks "Generate
# Domain" by hand. This ensures one exists.
#
# The URL itself needs no manual step: a PR environment inherits
# BETTER_AUTH_URL from the base environment, and server/utils/auth.ts detects
# that stale inherited value and uses RAILWAY_PUBLIC_DOMAIN instead.
#
# Required repository secret:
#   RAILWAY_API_TOKEN   - account or team token (Railway → Account Settings → Tokens)
# Required repository variables:
#   RAILWAY_PROJECT_ID  - Railway project id
#   RAILWAY_SERVICE_NAME - name of the app service (currently "applirank")
# Optional repository variable:
#   RAILWAY_PR_ENV_PREFIX - PR environment name prefix. Railway names these
#     after the repo, e.g. "reqcore-pr-266", so the default is "reqcore-pr-".

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number whose environment needs a domain
        required: true

permissions:
  contents: read

concurrency:
  group: railway-pr-domain-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  ensure-domain:
    name: Ensure PR environment has a public domain
    runs-on: ubuntu-latest
    # Forked PRs cannot read secrets, and Railway does not build them anyway.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      ENV_PREFIX: ${{ vars.RAILWAY_PR_ENV_PREFIX || 'reqcore-pr-' }}

    steps:
      # Fail immediately and loudly on missing config. Without this the CLI
      # calls below just fail as "environment not found", which looks like a
      # Railway timing problem rather than a setup problem.
      - name: Check required configuration
        run: |
          set -euo pipefail
          missing=""
          [ -n "$RAILWAY_API_TOKEN" ] || missing="$missing RAILWAY_API_TOKEN(secret)"
          [ -n "$PROJECT_ID" ] || missing="$missing RAILWAY_PROJECT_ID(variable)"
          [ -n "$SERVICE_NAME" ] || missing="$missing RAILWAY_SERVICE_NAME(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured. Missing:$missing — see the header of this workflow file."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Classifies the token before anything else can fail ambiguously.
      # An account/team token prints the signed-in user here; a project-scoped
      # token (which cannot see PR environments) errors instead.
      - name: Identify the Railway token
        run: |
          set -uo pipefail
          if railway whoami; then
            echo "Token is account/team scoped — correct for this workflow."
          else
            echo "::error::RAILWAY_API_TOKEN is not an account/team token. Project-scoped tokens are pinned to one environment and cannot see PR environments. Create one at Railway → Account Settings → Tokens (no environment picker) and re-run: gh secret set RAILWAY_API_TOKEN"
            exit 1
          fi

      - name: Wait for the PR environment and link to it
        id: env
        run: |
          set -euo pipefail
          ENV_NAME="${ENV_PREFIX}${PR_NUMBER}"
          echo "Looking for Railway environment: $ENV_NAME"

          # `railway link` doubles as the existence check: it exits 0 once the
          # environment exists, and non-zero (listing the real environment
          # names) while it does not. Railway creates the PR environment
          # asynchronously after the PR opens, hence the retry.
          for attempt in $(seq 1 20); do
            if railway link \
              --project "$PROJECT_ID" \
              --environment "$ENV_NAME" \
              --service "$SERVICE_NAME" 2>link.log; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$ENV_NAME not ready yet (attempt $attempt/20)"
            sleep 15
          done

          # Never appeared. The CLI's own error lists the environments it can
          # see, which distinguishes a naming mismatch from a token that lacks
          # access to the project.
          cat link.log || true
          echo "::error::Could not link Railway environment '$ENV_NAME'. If the names listed above differ, set the RAILWAY_PR_ENV_PREFIX variable; if none are listed, RAILWAY_API_TOKEN likely lacks access (a project-scoped token cannot see PR environments)."
          exit 1

      - name: Generate a domain if the service has none
        if: steps.env.outputs.found == 'true'
        run: |
          set -euo pipefail
          # Already linked by the previous step.

          # `railway domain` is idempotent: it prints the existing domain when
          # one is already attached rather than creating a second.
          railway domain | tee domain.txt

          echo "PREVIEW_URL=$(grep -oE '[a-z0-9.-]+\.up\.railway\.app' domain.txt | head -1)" >> "$GITHUB_ENV"

          # Railway injects RAILWAY_PUBLIC_DOMAIN at container start. A domain
          # created after the first deploy is invisible to the process already
          # running, so auth would keep using the inherited production URL.
          # Redeploy once, and only when we actually created the domain.
          if grep -q "already exist" domain.txt; then
            echo "Domain already existed — the running deployment already has it."
          else
            echo "Domain newly created — redeploying so the app picks it up."
            railway redeploy -y
          fi

      - name: Summary
        if: steps.env.outputs.found == 'true'
        run: |
          echo "Preview: https://${PREVIEW_URL:-unknown}" >> "$GITHUB_STEP_SUMMARY"
